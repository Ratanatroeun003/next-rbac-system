services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: sass_online
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - '8080:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sass.com
      PGADMIN_DEFAULT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: